<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Camrynn Job Search Buddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-mark">🐾</span>
      <div>
        <h1>Camrynn's Job Search Buddy</h1>
        <p class="tagline">Great jobs near Albuquerque, picked just for you!</p>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button data-tab="jobs" class="tab active"><span class="tab-icon">🔍</span>Find Jobs</button>
    <button data-tab="applications" class="tab"><span class="tab-icon">📋</span>My List</button>
  </nav>

  <main>
    <section id="jobs" class="panel active">
      <p class="section-intro">More stars means a better fit — animals or kids, easy tasks, no handling money.</p>
      <div class="panel-header">
        <button id="refresh-btn" class="btn-primary">✨ Find new jobs</button>
        <span id="refresh-status"></span>
      </div>
      <div class="filter-bar">
        <select id="filter-category">
          <option value="all">All job types</option>
          <option value="animal">🐾 Animal care</option>
          <option value="government">🏛️ Community</option>
          <option value="warehouse">📦 Warehouse</option>
          <option value="retail">🛍️ Retail</option>
          <option value="general">💼 General</option>
        </select>
        <select id="filter-rating">
          <option value="all">Any rating</option>
          <option value="great">🌟🌟🌟 Great matches only</option>
          <option value="good">🌟🌟 Good matches or better</option>
        </select>
        <select id="filter-sort">
          <option value="best">Sort: Best match</option>
          <option value="pay">Sort: Highest pay</option>
          <option value="new">Sort: Newest</option>
        </select>
      </div>
      <div id="jobs-list" class="cards"></div>
    </section>

    <section id="applications" class="panel">
      <p class="section-intro">Jobs you've picked — the right resume is already attached!</p>
      <div id="applications-list" class="cards"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
